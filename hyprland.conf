# hyprland.conf

monitor= , preferred, auto, 1

env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

exec-once = waybar
exec-once = pkill waybar && waybar
exec-once = nm-applet
exec-once = mako
exec-once = hyprpaper

# Fonts (mostly handled by apps/toolkits in Hyprland)
# No direct equivalent for sway's `font` setting

# Mod key
$mod = SUPER

# Launcher + Terminal
bind = $mod, RETURN, exec, kitty 
bind = $mod SHIFT, RETURN, exec, floorp --browser
bind = $mod, D, exec, fuzzel

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Window focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Window move
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Floating, fullscreen, kill
bind = $mod SHIFT, space, togglefloating,
bind = $mod, f, fullscreen, 1
bind = $mod SHIFT, f, fullscreen, 0
bind = $mod, Q, killactive,

# move and resize with mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bind = $mod, w, exec, /home/elis/.local/bin/toggle-waybar
bind = $mod, space, exec, bash $HOME/.config/hypr/switchkb.sh

# Screenshot
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

input {
    kb_layout = us,se
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
        disable_while_typing = false # lets you play games on a touchpad if you really want to.
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

cursor {
    no_hardware_cursors = true
}

general {
    gaps_in = 2
    gaps_out = 5
    border_size = 2
    col.active_border = rgba(cba6f7ee)
    col.inactive_border = rgba(11111bee)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 0
    active_opacity = 1
    inactive_opacity = 1
    shadow {
    	enabled = true
	range = 4
	render_power = 1
	color = rgba(0,0,0,0.3)
	color_inactive = rgba(0,0,0,0.1)
    }
  blur {
    enabled = true
    size = 5
    passes = 1
    ignore_opacity = true
    new_optimizations = true
  }
}

misc {
	vfr = true
}

animations {
	bezier = ease,0.83, 0, 0.17, 1
	animation = windowsIn, 1, 2,ease, popin
	animation = windowsOut, 1, 2,ease, popin
    animation = windowsMove, 1, 2, default, popin
	animation = workspaces, 1, 1, default, slide
    animation = border,0
}
dwindle {
	preserve_split = yes
	smart_split = yes
}

windowrulev2 = workspace 10, class:^(Spotify)$
exec-once = spotify; hyprctl dispatch movetoworkspace 1; vesktop
